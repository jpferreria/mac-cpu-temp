name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build cpu-temp
        run: |
          make build
          cd build
          ZIP_NAME="cpu-temp-${{ github.ref_name }}.zip"
          zip -r -y "${ZIP_NAME}" cpu-temp.app
          shasum -a 256 "${ZIP_NAME}" > checksum.txt
          echo "SHA256 Checksum:"
          cat checksum.txt

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          gh release upload "${{ github.ref_name }}" "cpu-temp-${{ github.ref_name }}.zip" checksum.txt --clobber
